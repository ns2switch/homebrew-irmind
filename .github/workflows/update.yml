name: Verify and update the formula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published IRMind release tag
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.generate.outputs.commit }}
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: 'v3.1.4'}
      - run: python3 -B tools/test_update.py
      - id: generate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          UPDATE_EVENT: ${{ github.event_name }}
        run: |
          mkdir -p generated/Formula
          if [ "$UPDATE_EVENT" = workflow_dispatch ]; then
            python3 tools/update.py --tag "$REQUESTED_TAG" --minimum-formula Formula/irmind.rb --output generated/Formula/irmind.rb
          else
            python3 tools/update.py --check-source Formula/irmind.rb --output generated/Formula/irmind.rb
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if cmp -s Formula/irmind.rb generated/Formula/irmind.rb; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: verified-formula, path: generated/Formula/irmind.rb, if-no-files-found: error}
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: verified-formula, path: candidate}
      - name: Audit, install, test and remove the verified release binaries
        shell: bash
        run: bash tools/native.sh candidate/irmind.rb candidate

  publish:
    needs: [prepare, native]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ needs.prepare.outputs.commit }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: verified-formula, path: verified}
      - env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 tools/publish.py verified/irmind.rb

  verify_published:
    needs: [prepare, native, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.native.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.changed == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: verified-formula, path: candidate}
      - name: Verify the published tap on a fresh native runner
        shell: bash
        run: bash tools/native.sh candidate/irmind.rb published
